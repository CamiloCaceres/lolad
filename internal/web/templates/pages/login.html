{{define "layout"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#07080F"><title>Sign in · lolad</title><link rel="icon" href="{{asset "favicon.svg"}}" type="image/svg+xml"><link rel="stylesheet" href="{{asset "app.css"}}"><link rel="stylesheet" href="{{asset "pages/login.css"}}"></head><body class="login-page"><main class="login-panel" id="main"><img class="login-logo" src="{{asset "logo.svg"}}" alt="lolad" width="88" height="88"><h1>Sign in to lolad</h1><p>Type the code shown on your computer, in <strong>Settings › Your phone</strong>. Or run <code>lolad pair</code> on it.</p>{{if .Error}}<p class="login-error" role="alert">{{.Error}}</p>{{end}}<form method="post" action="/login"><input type="hidden" name="next" value="{{.Next}}"><label for="credential" class="sr-only">Sign-in code</label><input id="credential" name="credential" type="password" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" required autofocus placeholder="Sign-in code"><button class="btn btn-primary" type="submit">Sign in</button></form><p class="login-note">A code works once, for 10 minutes. This browser stays signed in for 30 days after your last visit.</p></main></body></html>{{end}}
