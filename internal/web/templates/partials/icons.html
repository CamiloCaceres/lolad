{{define "state"}}<span class="state st-{{.State}}"><i aria-hidden="true"></i>{{.State}}</span>{{end}}

{{define "avatar"}}<span class="avatar{{if .Size}} avatar-{{.Size}}{{end}}" aria-hidden="true">{{initials .Display}}{{if .State}}<i class="dot st-{{.State}}"></i>{{end}}</span>{{end}}

{{define "flash"}}{{if .Error}}<p class="flash is-error" role="alert">{{template "icon" "x"}}<span>{{.Error}}</span></p>{{else if .Notice}}<p class="flash is-ok" role="status">{{template "icon" "check"}}<span>{{.Notice}}</span></p>{{end}}{{end}}
