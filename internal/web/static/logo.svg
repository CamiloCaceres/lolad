<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>lolad</title>
  <!-- lolad Night: a periwinkle ring with a dot, the "your turn" ring at rest. -->
  <defs>
    <filter id="lo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#7AA2FF" stroke-width="5" stroke-opacity=".55" filter="url(#lo-glow)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#7AA2FF" stroke-width="4.5"/>
  <circle cx="32" cy="32" r="7" fill="#7AA2FF" filter="url(#lo-glow)" opacity=".8"/>
  <circle cx="32" cy="32" r="6.5" fill="#7AA2FF"/>
</svg>
