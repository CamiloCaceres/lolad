# Shipped with Lolad.app (Resources/tmux.conf). Mirrors what internal/tmux
# writes into the state dir, plus the terminfo entry every Mac has.
set -g default-terminal "screen-256color"
set -g base-index 0
set -g pane-base-index 0
set -g remain-on-exit on
set -g history-limit 50000
set -g status off
set -g mouse off
set -s escape-time 0
