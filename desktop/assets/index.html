<!doctype html>
<meta charset="utf-8">
<title>Lolad</title>
<meta name="color-scheme" content="dark">
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;font:15px/1.6 -apple-system,system-ui,sans-serif;color:#F2F4FF;
       background:radial-gradient(1200px 700px at 20% -10%,#1a1d3a 0,transparent 60%),#07080F}
  main{max-width:28rem;padding:2rem;text-align:center}
  svg{width:96px;height:96px;filter:drop-shadow(0 0 24px rgba(108,125,255,.45));animation:breathe 4s ease-in-out infinite}
  h1{font-weight:300;font-size:2rem;letter-spacing:-.02em;margin:1.5rem 0 .5rem}
  p{margin:0;color:#B8BED8}
  p+p{margin-top:.75rem;color:#8A91AE;font-size:13px}
  b{color:#F2F4FF;font-weight:600}
  code{font:12px ui-monospace,monospace;color:#B8BED8}
  @keyframes breathe{50%{transform:scale(1.04);opacity:.85}}
  @media (prefers-reduced-motion:reduce){svg{animation:none}}
</style>
<main>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <radialGradient id="o" cx="34%" cy="30%" r="80%"><stop offset="0" stop-color="#EEF3FF"/><stop offset=".2" stop-color="#9FB8FF"/><stop offset=".5" stop-color="#6C7DFF"/><stop offset=".78" stop-color="#7B4FE0"/><stop offset="1" stop-color="#241A5E"/></radialGradient>
      <linearGradient id="b" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3DE8D0" stop-opacity="0"/><stop offset=".45" stop-color="#3DE8D0" stop-opacity=".85"/><stop offset="1" stop-color="#DCE6FF" stop-opacity="0"/></linearGradient>
      <clipPath id="c"><circle cx="44" cy="56" r="34"/></clipPath>
    </defs>
    <circle cx="44" cy="56" r="34" fill="url(#o)"/>
    <g clip-path="url(#c)" fill="none" stroke-linecap="round"><path d="M6 78C26 58 52 54 84 62" stroke="url(#b)" stroke-width="9"/><path d="M10 92C32 74 58 72 86 80" stroke="url(#b)" stroke-width="4" opacity=".55"/></g>
  </svg>
  <h1>lolad isn’t running.</h1>
  <p>Your assistants are paused. Nothing is lost: messages wait until lolad starts again. Use the menu bar icon ▸ <b>Start lolad</b>.</p>
  <p>This window connects by itself. Or run <code>lolad serve</code> in a terminal.</p>
</main>
